name: Deploy Web App to GitHub Pages

on:
  push:
    branches:
      - main
    paths:
      - "apps/web/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Prepare web app
        shell: bash
        run: |
          rm -rf pages-dist
          mkdir -p pages-dist
          cp apps/web/index.html \
            apps/web/styles.css \
            apps/web/app.js \
            apps/web/manifest.webmanifest \
            apps/web/offline.html \
            apps/web/service-worker.js \
            pages-dist/
          cp -R apps/web/assets pages-dist/assets
          find pages-dist -name ".DS_Store" -delete

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: pages-dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
